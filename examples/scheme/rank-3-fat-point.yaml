type: scheme
name: $\Spec \QQ[x,y]/(x,y)^2$
description: The scheme $\Spec \QQ[x,y]/(x^2,xy,y^2)$.

adjectives:
  affine: [true, By definition.]
  reduced: [false, "The element $x \\in \\QQ[x,y]/(x^2,xy,y^2)$ is nilpotent."]
  single-pointed: [true, "$\\QQ[x,y]/(x,y)^2$ has a unique prime ideal $(x,y)$."]
  cohen-macaulay: [true, "Zero-dimensional local ring, hence Cohen-Macaulay."]
